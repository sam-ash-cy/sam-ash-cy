<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 150" width="1000" height="150" role="img" aria-label="Thanks for visiting">
	<!-- Plain SVG + CSS only: GitHub serves README images through its camo proxy, which strips scripts and blocks external fonts. -->
	<style>
		.mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
		.prompt { fill: #3fb950; font-size: 15px; }
		.cmd { fill: #e6edf3; font-size: 15px; }
		.out { fill: #3fb950; font-size: 15px; }
		.hex { fill: #3fb950; font-size: 11px; opacity: 0.3; }

		.show { opacity: 0; animation: show 0.01s linear forwards; }
		@keyframes show { to { opacity: 1; } }

		/* Typing: a background-coloured block slides right one character at a time to uncover the command. */
		.type { animation-name: type; animation-fill-mode: forwards; }
		@keyframes type { to { transform: translateX(var(--w)); } }

		.cursor { animation: blink 1s steps(1) infinite; }
		@keyframes blink { 50% { opacity: 0; } }

		/* Hex stream is drawn twice, 1000px apart, so the scroll loops seamlessly. */
		.stream { animation: left 30s linear infinite; }
		@keyframes left { from { transform: translateX(0); } to { transform: translateX(-1000px); } }

		@media (prefers-reduced-motion: reduce) {
			* { animation: none !important; }
			.show { opacity: 1; }
			.cover { display: none; }
		}
	</style>

	<defs>
		<clipPath id="frame"><rect x="10" y="10" width="980" height="130" rx="10" /></clipPath>
		<clipPath id="session"><rect x="20" y="20" width="960" height="96" /></clipPath>
		<text id="hexline" class="mono hex" y="132" textLength="960" lengthAdjust="spacingAndGlyphs">0x53 0x45 0x43 0x55 0x52 0x45 0x20 0x42 0x59 0x20 0x44 0x45 0x53 0x49 0x47 0x4e  ::  4f 57 41 53 50  ::  0x73 0x68 0x61 0x32 0x35 0x36  ::  0x74 0x6c 0x73 0x31 0x2e 0x33  ::  0x41 0x45 0x53</text>
	</defs>

	<rect x="10" y="10" width="980" height="130" rx="10" fill="#0d1117" stroke="#30363d" />

	<g clip-path="url(#session)" class="mono">
		<text x="30" y="44"><tspan class="prompt">sam@ashman:~$ </tspan><tspan class="cmd">echo "thanks for visiting, let's connect"</tspan></text>
		<rect class="cover type" x="156" y="30" width="372" height="20" fill="#0d1117" style="--w: 372px; animation-duration: 2s; animation-delay: 0.4s; animation-timing-function: steps(41);" />

		<text x="30" y="70" class="out show" style="animation-delay: 2.6s;">thanks for visiting, let's connect</text>

		<g class="show" style="animation-delay: 3s;">
			<text x="30" y="96" class="prompt">sam@ashman:~$</text>
			<rect class="cursor" x="158" y="83" width="9" height="17" fill="#3fb950" />
		</g>
	</g>

	<g clip-path="url(#frame)">
		<line x1="10" y1="118" x2="990" y2="118" stroke="#30363d" />
		<g class="stream">
			<use href="#hexline" x="20" />
			<use href="#hexline" x="1020" />
		</g>
	</g>
</svg>
