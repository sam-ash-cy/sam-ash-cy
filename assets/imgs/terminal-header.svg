<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" role="img" aria-label="Samuel Ashman — Full Stack Developer">
	<!-- Generated from profile.config.ts by preview/generators/header.ts. Plain SVG + CSS only: GitHub's image proxy strips scripts and blocks web fonts. -->
	<style>
		.mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
		.prompt { fill: #3fb950; font-size: 15px; }
		.cmd { fill: #e6edf3; font-size: 15px; }
		.name { fill: #e6edf3; font-size: 38px; font-weight: 700; }
		.role { fill: #e6edf3; font-size: 22px; font-weight: 600; }
		.focus { fill: #e6edf3; font-size: 20px; font-weight: 600; }
		.focus .prompt { font-size: 20px; }
		.code { fill: #3fb950; font-size: 11px; opacity: 0.32; }
		.code-alt { fill: #8b949e; font-size: 11px; opacity: 0.4; }
		.title { fill: #8b949e; font-size: 12px; }

		.show { opacity: 0; animation: show 0.01s linear forwards; }
		.fade { opacity: 0; animation: fade 0.5s ease-out forwards; }
		@keyframes show { to { opacity: 1; } }
		@keyframes fade { to { opacity: 1; } }

		.type { animation-name: type; animation-fill-mode: forwards; }
		@keyframes type { to { transform: translateX(var(--w)); } }

		.cycle { opacity: 0; animation: cycle 15s linear infinite; }
		@keyframes cycle { 0% { opacity: 0; } 2.00% { opacity: 1; } 18.00% { opacity: 1; } 20.00% { opacity: 0; } 100% { opacity: 0; } }

		.cursor { animation: blink 1s steps(1) infinite; }
		@keyframes blink { 50% { opacity: 0; } }

		.up { animation: up 22.2s linear infinite; }
		.down { animation: down 26.2s linear infinite; }
		@keyframes up { from { transform: translateY(0); } to { transform: translateY(-288px); } }
		@keyframes down { from { transform: translateY(-288px); } to { transform: translateY(0); } }

		@media (prefers-reduced-motion: reduce) {
			* { animation: none !important; }
			.show, .fade, .cycle-first { opacity: 1; }
			.cover { display: none; }
		}
	</style>

	<defs>
