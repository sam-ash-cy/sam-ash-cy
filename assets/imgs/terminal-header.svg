		<g id="streamR" class="mono code-alt">
			<text x="784" y="64" xml:space="preserve">function verify($u, $c) {</text>
			<text x="784" y="80" xml:space="preserve">  $h = get_hash($u);</text>
			<text x="784" y="96" xml:space="preserve">  if (!hash_equals(</text>
			<text x="784" y="112" xml:space="preserve">    $h, hash('sha256', $c)</text>
			<text x="784" y="128" xml:space="preserve">  )) {</text>
			<text x="784" y="144" xml:space="preserve">    lockout($u, $ip);</text>
			<text x="784" y="160" xml:space="preserve">    return false;</text>
			<text x="784" y="176" xml:space="preserve">  }</text>
			<text x="784" y="192" xml:space="preserve">  consume($u);</text>
			<text x="784" y="208" xml:space="preserve">  return true;</text>
			<text x="784" y="224" xml:space="preserve">}</text>
			<text x="784" y="240" xml:space="preserve">const csp = [</text>
			<text x="784" y="256" xml:space="preserve">  &quot;default-src 'self'&quot;,</text>
			<text x="784" y="272" xml:space="preserve">  &quot;frame-ancestors 'none'&quot;,</text>
			<text x="784" y="288" xml:space="preserve">].join('; ');</text>
			<text x="784" y="304" xml:space="preserve">SELECT id FROM users</text>
			<text x="784" y="320" xml:space="preserve"> WHERE email = ?;</text>
			<text x="784" y="336" xml:space="preserve">// prepared, never concat</text>
